<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing URL Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bugs"></canvas>

<div class="container">
    <h1>PHISHING URL DETECTOR</h1>

    <input type="text" id="urlInput" placeholder="Enter target URL">
    <input type="password" id="apiKey" placeholder="VirusTotal API key (optional)" aria-label="VirusTotal API key" autocomplete="off">
    <button id="scan">INITIATE SCAN</button>
    <p class="subtitle">The key stays in this tab and is visible in browser requests. Noncommercial use only.</p>

    <div id="terminal" class="terminal hidden"></div>
    <div id="resultBox" class="result hidden" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
